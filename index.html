<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .text { font-family: 'Arial Black', sans-serif; font-size: 48px; font-weight: bold; }
    .arrow { fill: #3498DB; }
  </style>
  <text x="20" y="65" class="text" fill="url(#grad1)">Ex</text>
  <polygon points="115,40 135,50 115,60" class="arrow"/>
  <text x="140" y="65" class="text" fill="url(#grad1)">Pay</text>
</svg>

<svg width="300" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .text { font-family: 'Courier New', monospace; font-size: 42px; font-weight: bold; }
    .circle { fill: none; stroke: #2ECC71; stroke-width: 3; }
    .chip { fill: #7F8C8D; }
  </style>
  <text x="20" y="65" class="text" fill="url(#grad2)">Ex</text>
  <circle cx="155" cy="45" r="25" class="circle"/>
  <text x="140" y="65" class="text" fill="url(#grad2)">Pay</text>
  <rect x="80" y="75" width="140" height="10" rx="5" class="chip"/>
  <rect x="90" y="85" width="120" height="5" rx="2" class="chip"/>
</svg>
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .e { font-family: 'Arial', sans-serif; font-size: 50px; font-weight: 900; fill: #2980B9; }
    .dollar { font-family: 'Arial', sans-serif; font-size: 50px; font-weight: 900; fill: #27AE60; }
    .p { font-family: 'Arial', sans-serif; font-size: 60px; font-weight: 100; fill: #E74C3C; }
    .ay { font-family: 'Arial', sans-serif; font-size: 40px; font-weight: bold; fill: #2C3E50; }
  </style>
  <text x="10" y="65" class="e">E</text>
  <text x="60" y="65" class="dollar">$</text>
  <text x="100" y="70" class="p">P</text>
  <text x="150" y="65" class="ay">ay</text>
</svg>


<svg width="300" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .circle { fill: none; stroke: url(#grad3); stroke-width: 5; }
    .text { font-family: 'Verdana', sans-serif; font-size: 40px; font-weight: bold; fill: #1A5276; }
    .ep { font-family: 'Verdana', sans-serif; font-size: 28px; font-weight: bold; fill: white; }
    .arrow { fill: #3498DB; }
  </style>
  <circle cx="80" cy="60" r="40" class="circle"/>
  <text x="60" y="70" class="ep">EP</text>
  <polygon points="80,30 95,60 80,90 65,60" class="arrow"/>
  <text x="140" y="70" class="text">Expay</text>
</svg>
